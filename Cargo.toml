[package]
name = "brz-io"
version = "0.0.5"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/we-breeze/io"
readme = "README.md"
description = "Arena-backed segmented byte readers and writers for Breeze"

[lib]
name = "brz_io"

[dependencies]
elsa = "1.11"
brz-ds = { package = "brz-ds", version = "0.0.5", default-features = false }
tokio = { version = "1", features = ["io-util"], optional = true }

[features]
default = ["tokio"]
tokio = ["dep:tokio", "brz-ds/tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }

[lints.rust]
unsafe_code = "deny"
