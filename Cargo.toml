[package]
name = "io"
version = "0.1.0"
edition = "2024"
description = "Arena-backed segmented byte readers and writers for Breeze"

[lib]
name = "brz_io"

[dependencies]
elsa = "1.11"
brz-ds = { package = "brz-ds", version = "0.0.2", default-features = false }
tokio = { version = "1", features = ["io-util"], optional = true }

[features]
default = ["tokio"]
tokio = ["dep:tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
